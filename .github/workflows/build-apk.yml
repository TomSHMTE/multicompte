name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier le SDK Android
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "Outils de compilation : $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Installer les dépendances
        run: npm ci

      - name: Créer le projet Android
        run: |
          npx cap add android
          npm run assets
          cp -r android-res/. android/app/src/main/res/

      - name: Numéro de version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i "s/var APP_VERSION = '1.0';/var APP_VERSION = '1.0.${{ github.run_number }}';/" www/app.js
          npx cap sync android

      - name: Compiler et signer l'APK
        run: >
          npx cap build android
          --keystorepath "$GITHUB_WORKSPACE/keystore/multicompte.jks"
          --keystorepass multicompte
          --keystorealias multicompte
          --keystorealiaspass multicompte
          --androidreleasetype APK
          --signing-type apksigner

      - name: Récupérer l'APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | grep -i signed | head -n1)
          if [ -z "$APK" ]; then APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1); fi
          echo "APK trouvé : $APK"
          cp "$APK" multicompte.apk

      - name: Publier le lien de téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Multicompte 1.0.${{ github.run_number }}
          body: Télécharger multicompte.apk ci-dessous, puis l'ouvrir sur le téléphone Android.
          files: multicompte.apk
          make_latest: true
